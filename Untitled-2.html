<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Marcador: Piedras Vivas</title>
    <style>
        body { background-color: #2c3e50; color: white; font-family: sans-serif; text-align: center; }
        .container { display: flex; justify-content: space-around; padding: 20px; }
        .equipo { width: 45%; border: 2px solid #ecf0f1; border-radius: 10px; padding: 10px; }
        .muro { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        
        /* El Ladrillo */
        .ladrillo {
            width: 80px; height: 40px;
            background-color: #34495e; /* Color apagado */
            border: 1px solid #7f8c8d;
            border-radius: 4px;
            transition: all 0.5s;
        }

        /* Clase para encender el ladrillo */
        .activo-a { background-color: #e67e22; box-shadow: 0 0 15px #e67e22; border-color: white; } /* Naranja Pescadores */
        .activo-b { background-color: #f1c40f; box-shadow: 0 0 15px #f1c40f; border-color: white; } /* Amarillo Constructores */
    </style>
</head>
<body>
    <h1>CONSTRUYENDO LA IGLESIA: SEMANA 7</h1>
    
    <div class="container">
        <div class="equipo">
            <h2>🎣 Los Pescadores</h2>
            <p>Gerald, Joshua, Ixayana, Valeria</p>
            <div class="muro">
                <div class="ladrillo activo-a"></div>
                <div class="ladrillo"></div>
                <div class="ladrillo"></div>
                <div class="ladrillo"></div>
                <div class="ladrillo"></div>
                <div class="ladrillo"></div>
            </div>
        </div>

        <div class="equipo">
            <h2>🏗️ Los Constructores</h2>
            <p>Alejandro, Josseline, Leonora, Santiago Josué</p>
            <div class="muro">
                <div class="ladrillo activo-b"></div>
                <div class="ladrillo"></div>
                <div class="ladrillo"></div>
                <div class="ladrillo"></div>
                <div class="ladrillo"></div>
                <div class="ladrillo"></div>
            </div>
        </div>
    </div>
</body>
</html>
